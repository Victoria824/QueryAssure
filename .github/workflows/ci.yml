name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install Python package
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -e '.[dev]'
      - name: Run Python tests
        run: |
          pytest
          ruff check .
          bandit -r src scripts -q
          pip-audit --local --skip-editable
      - name: Run QueryAssure golden suite
        run: |
          queryassure seed --orders 1000
          queryassure validate-data
          queryassure test --suite evals/retail.yml
          queryassure m365-demo --output reports/microsoft365.json \
            --html reports/microsoft365.html
          queryassure enterprise-demo --output reports/enterprise-evidence.json \
            --html reports/enterprise-governance.html
          queryassure challenge
          queryassure demo --output reports/demo --no-open
          queryassure benchmark --report reference=reports/latest.json
      - name: Install web dependencies
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Type-check and test playground
        run: |
          npm run lint
          npm test
      - name: Upload benchmark
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: northstar-benchmark
          path: |
            benchmarks/
            reports/*.html
            reports/demo/*.html

  dogfood-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run QueryAssure as a reusable action
        uses: ./
        with:
          suite: evals/retail.yml
          report: reports/action.json

  docker-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the complete stack
        run: docker compose build
      - name: Start containers
        run: docker compose up -d
      - name: Wait for API health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1
      - name: Wait for the playground
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1
      - name: Verify the agent schema endpoint
        run: curl --fail --silent http://localhost:8000/api/schema > /dev/null
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down --volumes

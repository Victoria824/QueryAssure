name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install Python package
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -e '.[dev]'
      - name: Validate Python and SQL Agent contracts
        run: |
          pytest
          ruff check .
          bandit -r src scripts -q
          pip-audit --local --skip-editable
          queryassure seed --orders 1000
          queryassure validate-data
          queryassure test --suite evals/retail.yml
          queryassure m365-demo --output reports/microsoft365.json \
            --html reports/microsoft365.html
          queryassure enterprise-demo --output reports/enterprise-evidence.json \
            --html reports/enterprise-governance.html
          queryassure challenge
          queryassure demo --output reports/demo --no-open
      - name: Validate playground
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm test

  python-artifacts:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and verify distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes_file" ]]; then
            notes_file="CHANGELOG.md"
          fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "QueryAssure $GITHUB_REF_NAME" \
              --notes-file "$notes_file"
          fi

  containers:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: queryassure-api
            dockerfile: Dockerfile
          - name: queryassure-playground
            dockerfile: Dockerfile.web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push versioned container
        env:
          IMAGE: ghcr.io/victoria824/${{ matrix.name }}
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          docker build \
            --file "${{ matrix.dockerfile }}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${version}" \
            --tag "${IMAGE}:${version}" \
            --tag "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${version}"
          docker push "${IMAGE}:latest"

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Toronto
    groups:
      frontend-runtime:
        patterns:
          - next
          - react
          - react-dom
      cloudflare-toolchain:
        patterns:
          - "@cloudflare/*"
          - vinext
          - vite
          - wrangler
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Toronto
    groups:
      python-runtime:
        patterns:
          - "*"
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "09:30"
      timezone: America/Toronto
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
